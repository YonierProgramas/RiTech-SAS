spring.application.name=ritech-sas
server.port=8080

spring.datasource.url=${RITECH_DB_URL:jdbc:mysql://localhost:3306/ritech_sprint2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${RITECH_DB_USER:root}
spring.datasource.password=${RITECH_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=UTC
server.error.include-message=always

# Solo para el prototipo académico: normaliza las claves de las 6 cuentas DEMO.
ritech.demo.reset-passwords=${RITECH_DEMO_RESET_PASSWORDS:true}
ritech.demo.password=${RITECH_DEMO_PASSWORD:Ritech2026*}

ritech.documentos.storage-dir=${RITECH_DOCUMENTOS_DIR:./uploads/documentos}
ritech.documentos.max-bytes=${RITECH_DOCUMENTOS_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=${RITECH_DOCUMENTOS_MAX_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${RITECH_DOCUMENTOS_MAX_BYTES:10485760}B
